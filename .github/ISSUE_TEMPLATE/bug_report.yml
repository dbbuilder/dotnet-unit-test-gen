name: Bug Report
description: File a bug report to help us improve
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run command '...'
        2. With these options '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      description: Which language were you testing?
      options:
        - C#
        - VB.NET
        - React
        - Vue.js
        - T-SQL
        - Integration
        - Other
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: AI Provider
      description: Which AI provider were you using?
      options:
        - OpenAI (GPT-4o mini)
        - OpenAI (GPT-4o)
        - Anthropic (Claude 3.5 Haiku)
        - Google (Gemini 2.0 Flash)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of the tool are you using?
      placeholder: "1.3.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide your environment details
      placeholder: |
        - OS: Ubuntu 22.04
        - Python: 3.11.4
        - pip list output (if relevant)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please paste any relevant log output (remove API keys!)
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have removed all sensitive information (API keys, paths, etc.)
          required: true
        - label: I am using the latest version
          required: false
